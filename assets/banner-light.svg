      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1F6FEB" stroke-opacity="0.09"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <g stroke="#1F6FEB" stroke-opacity="0.45" stroke-width="1.5" fill="none">
      <line x1="760" y1="210" x2="880" y2="120"/>
      <line x1="880" y1="120" x2="980" y2="190"/>
      <line x1="880" y1="120" x2="1010" y2="70"/>
      <line x1="980" y1="190" x2="1100" y2="130"/>
      <line x1="980" y1="190" x2="940" y2="270"/>
      <line x1="1100" y1="130" x2="1010" y2="70"/>
      <line x1="760" y1="210" x2="940" y2="270"/>
    </g>
    <g fill="#FFFFFF" stroke="#1F6FEB" stroke-width="2">
      <circle cx="760" cy="210" r="9"/>
      <circle cx="1010" cy="70" r="9"/>
      <circle cx="1100" cy="130" r="9"/>
      <circle cx="940" cy="270" r="9"/>
    </g>
    <circle cx="880" cy="120" r="14" fill="#1F6FEB"/>
    <circle cx="980" cy="190" r="20" fill="url(#accent)"/>
    <circle cx="980" cy="190" r="20" fill="none" stroke="#1F6FEB" stroke-width="2">
      <animate attributeName="r" values="20;42" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <text x="64" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#1F6FEB">~/iniey</text>
    <text x="64" y="176" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="92" font-weight="700" fill="#0A1020" letter-spacing="-2">IniEy</text>
    <rect x="66" y="196" width="88" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="64" y="244" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#1E3763">Offline-first apps. Microservices.</text>
    <text x="64" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#5B7299">AI as a tool, not a crutch.</text>
    <rect x="394" y="258" width="11" height="22" fill="#1F6FEB">
