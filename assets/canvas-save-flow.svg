<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 556" width="420" height="556" role="img" aria-labelledby="title desc">
  <title id="title">How Canvas saves a board</title>
  <desc id="desc">Excalidraw changes are debounced for 800 ms, then saveBoard in Tauri writes boards.json plus one folder per board containing board.json, assets, and snapshots.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#0F2A5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58A6FF" fill-opacity="0.65"/>
    </marker>
    <clipPath id="card">
      <rect width="420" height="556" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="420" height="556" fill="url(#bg)"/>
    <rect width="420" height="556" fill="url(#glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="418.5" height="554.5" rx="15.25" fill="none" stroke="#58A6FF" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Excalidraw trigger -->
  <rect x="24" y="24" width="372" height="62" rx="12" fill="#0B1830" stroke="#58A6FF" stroke-opacity="0.38" stroke-width="1.5"/>
  <text x="210" y="50" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#E6EDF8">Excalidraw onChange</text>
  <text x="210" y="70" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9DB2CE">React 19</text>

  <!-- Debounce -->
  <line x1="210" y1="86" x2="210" y2="120" stroke="#58A6FF" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="129" y="92" width="162" height="23" rx="11.5" fill="#0F2A5C" stroke="#58A6FF" stroke-opacity="0.35" stroke-width="1"/>
  <text x="210" y="107.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#7DC4FF">debounced 800 ms</text>

  <!-- Save function -->
  <rect x="24" y="124" width="372" height="62" rx="12" fill="#0B1830" stroke="#58A6FF" stroke-opacity="0.38" stroke-width="1.5"/>
  <text x="210" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#E6EDF8">saveBoard()</text>
  <text x="210" y="170" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9DB2CE">Tauri fs plugin · one queued write path</text>

  <line x1="210" y1="186" x2="210" y2="220" stroke="#58A6FF" stroke-opacity="0.65" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output tree -->
  <rect x="24" y="224" width="372" height="306" rx="12" fill="#0A1020" fill-opacity="0.72" stroke="#58A6FF" stroke-opacity="0.22" stroke-width="1.5"/>

  <text x="44" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#9DB2CE">app-data/</text>
  <text x="376" y="252" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#6F87A6">written on save</text>
  <line x1="44" y1="264" x2="376" y2="264" stroke="#58A6FF" stroke-opacity="0.18" stroke-width="1"/>

  <!-- index -->
  <text x="44" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#E6EDF8">boards.json</text>
  <text x="376" y="294" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#9DB2CE">library index</text>

  <!-- board folder -->
  <text x="44" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#7DC4FF">boards/&lt;id&gt;/</text>
  <text x="376" y="332" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#6F87A6">one folder per board</text>

  <path d="M54 340 V442 M54 370 H64 M54 406 H64 M54 442 H64" fill="none" stroke="#58A6FF" stroke-opacity="0.28" stroke-width="1.2"/>

  <!-- board files -->
  <text x="66" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#E6EDF8">board.json</text>
  <text x="376" y="370" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#9DB2CE">scene + app state</text>

  <text x="66" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#E6EDF8">assets/</text>
  <text x="376" y="406" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#9DB2CE">images on disk</text>

  <text x="66" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#E6EDF8">snapshots/*.json</text>
  <text x="376" y="442" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#9DB2CE">version history</text>

  <line x1="44" y1="460" x2="376" y2="460" stroke="#58A6FF" stroke-opacity="0.14" stroke-width="1"/>
  <text x="66" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6F87A6">auto snapshot: max 1 per 5 min</text>
</svg>
